<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abel&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Anton&family=Archivo+Black&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/vinyl-record.ico') }}">
</head>

<body>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <ul id="flash-messages">
            {% for category, message in messages %}
                <li class="flash {{ category }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% endwith %}

{% block content %}{% endblock %}

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    setTimeout(function () {
        $("#flash-messages").fadeOut("fast");
    }, 5000);
</script>

</body>
</html>
